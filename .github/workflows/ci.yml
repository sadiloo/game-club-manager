name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    name: ubuntu net10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: test net10
        run: dotnet test GameClub.slnx -c Release -f net10.0 --nologo

  windows:
    name: windows net48 and net10
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: test every target framework
        run: dotnet test GameClub.slnx -c Release --nologo
