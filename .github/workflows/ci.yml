name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    name: ubuntu net10
    if: github.ref != 'refs/heads/cursor/kiosk-locked-probe' && github.ref != 'refs/heads/cursor/kiosk-locked-probe-v2'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gameclub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GAMECLUB_DATABASE: Host=localhost;Port=5432;Database=gameclub_test;Username=postgres;Password=postgres
      GAMECLUB_TEST_DATABASE: Host=localhost;Port=5432;Database=gameclub_test;Username=postgres;Password=postgres
      GAMECLUB_API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: test net10
        run: dotnet test GameClub.slnx -c Release -f net10.0 --nologo -m:1
      - name: kiosk owned-server G2 and re-pair oracle
        if: always()
        timeout-minutes: 25
        run: |
          dotnet test tests/GameClub.Kiosk.Windows.IntegrationTests/GameClub.Kiosk.Windows.IntegrationTests.csproj \
            -c Release -f net10.0 --no-build --nologo \
            --filter "FullyQualifiedName~live_server_two_outages_bill_matches_main_g2_oracle|FullyQualifiedName~live_server_re_pair_new_device_key_heartbeats_resume" \
            --logger "console;verbosity=normal"
      - name: post-test orphan postgres writers
        if: always()
        env:
          PGPASSWORD: postgres
        run: |
          rows=$(psql -h localhost -U postgres -d gameclub_test -tA -c "SELECT count(*) FROM pg_stat_activity WHERE datname = 'gameclub_test' AND pid <> pg_backend_pid() AND state <> 'idle' AND query NOT ILIKE '%pg_stat_activity%';")
          echo "non_idle_pg_writers=$rows"
          test "$rows" = "0"

  windows:
    name: windows net48 and net10
    if: github.ref != 'refs/heads/cursor/kiosk-locked-probe' && github.ref != 'refs/heads/cursor/kiosk-locked-probe-v2'
    timeout-minutes: 10
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: build net48 kiosk and guard
        run: dotnet build src/GameClub.Kiosk/GameClub.Kiosk.csproj -c Release -f net48 --nologo && dotnet build src/GameClub.Kiosk.Guard/GameClub.Kiosk.Guard.csproj -c Release -f net48 --nologo
      - name: test every target framework except server and windows kiosk integration
        run: dotnet test GameClub.slnx -c Release --nologo --filter "FullyQualifiedName!~GameClub.Server.Tests&FullyQualifiedName!~GameClub.Kiosk.Windows.IntegrationTests" --results-directory artifacts/windows-ci --logger "trx;LogFileName=windows-ci.trx"
      - name: upload windows ci test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-net48-net10-tests
          path: artifacts/windows-ci/**

  windows-kiosk-integration:
    name: windows-2022 kiosk integration
    timeout-minutes: ${{ (github.ref == 'refs/heads/cursor/kiosk-locked-probe' || github.ref == 'refs/heads/cursor/kiosk-locked-probe-v2') && 250 || 40 }}
    runs-on: windows-2022
    env:
      GAMECLUB_DATABASE: Host=localhost;Port=5432;Database=gameclub_test;Username=postgres;Password=postgres;SSL Mode=Disable
      GAMECLUB_TEST_DATABASE: Host=localhost;Port=5432;Database=gameclub_test;Username=postgres;Password=postgres;SSL Mode=Disable
      GAMECLUB_API_KEY: ci-test-key
      OperatorSessionSecret: ci-operator-secret-r11
      CHECKPOINT_SERVER_URL: http://127.0.0.1:5225
      ASPNETCORE_URLS: http://127.0.0.1:5225
      WPF_STABILITY_RUNS: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: disable in-step wpf stability loop
        if: github.ref != 'refs/heads/cursor/kiosk-locked-probe'
        shell: pwsh
        run: echo "WPF_STABILITY_RUNS=0" >> $env:GITHUB_ENV
      - name: install and start postgresql
        shell: pwsh
        run: |
          choco install postgresql16 --params '/Password:postgres' -y --no-progress
          $env:PGPASSWORD = 'postgres'
          $pgIsReady = 'C:\Program Files\PostgreSQL\16\bin\pg_isready.exe'
          $psql = 'C:\Program Files\PostgreSQL\16\bin\psql.exe'
          $deadline = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $deadline) {
            & $pgIsReady -U postgres 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 3
          }
          if ($LASTEXITCODE -ne 0) { throw 'postgresql service not ready' }
          $exists = & $psql -h 127.0.0.1 -U postgres -c "SELECT 1 FROM pg_database WHERE datname='gameclub_test'" -tA 2>$null
          if (-not $exists) { & $psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE gameclub_test;" }
      - name: windows kiosk integration
        if: github.ref != 'refs/heads/cursor/kiosk-locked-probe'
        timeout-minutes: 22
        shell: pwsh
        run: ./scripts/windows/ci-integration.ps1
      - name: kiosk host reconnect mutations (net48 D7 and status tick)
        if: always() && github.ref != 'refs/heads/cursor/kiosk-locked-probe'
        shell: pwsh
        env:
          MUTOUT_DIR: artifacts/kiosk-reconnect-mut
          MUT_HOST_ONLY: "1"
        run: |
          New-Item -ItemType Directory -Force -Path $env:MUTOUT_DIR | Out-Null
          python scripts/agent/run-kiosk-reconnect-mutations.py | Tee-Object -FilePath "$env:MUTOUT_DIR/mutations.log"
          Get-Content "$env:MUTOUT_DIR/mutations-r1d.json"
      - name: orphan server and db writer check
        if: always() && github.ref != 'refs/heads/cursor/kiosk-locked-probe'
        timeout-minutes: 2
        shell: pwsh
        run: ./scripts/windows/ci-orphan-check.ps1
      - name: probe v2 host_logout_open_ack loop (20 runs)
        if: always() && github.ref == 'refs/heads/cursor/kiosk-locked-probe-v2'
        timeout-minutes: 30
        shell: pwsh
        env:
          HOST_LOGOUT_LOOP_RUNS: "20"
          HOST_LOGOUT_FAIL_LATE: "1"
        run: ./scripts/windows/ci-probe-v2-host-logout-loop.ps1
      - name: wpf remaining time stability (20 runs)
        if: always() && github.ref != 'refs/heads/cursor/kiosk-locked-probe' && github.ref != 'refs/heads/cursor/kiosk-locked-probe-v2'
        timeout-minutes: 25
        shell: pwsh
        env:
          WPF_STABILITY_RUNS: "20"
        run: ./scripts/windows/ci-integration-wpf-stability.ps1
      - name: probe v2 pre-batch diagnostics (batch 1)
        if: always() && github.ref == 'refs/heads/cursor/kiosk-locked-probe-v2'
        shell: pwsh
        run: ./scripts/windows/ci-probe-v2-pre-batch.ps1 -Batch 1
      - name: probe v2 wpf stability batch 1 of 3 (runs 1-20)
        if: always() && github.ref == 'refs/heads/cursor/kiosk-locked-probe-v2'
        timeout-minutes: 55
        shell: pwsh
        env:
          WPF_STABILITY_RUNS: "20"
          WPF_STABILITY_FAIL_LATE: "1"
          WPF_STABILITY_PROBE_V2: "1"
          WPF_STABILITY_BATCH: "1"
          WPF_STABILITY_BATCH_OFFSET: "0"
        run: ./scripts/windows/ci-integration-wpf-stability.ps1
      - name: probe v2 pre-batch diagnostics (batch 2)
        if: always() && github.ref == 'refs/heads/cursor/kiosk-locked-probe-v2'
        shell: pwsh
        run: ./scripts/windows/ci-probe-v2-pre-batch.ps1 -Batch 2
      - name: probe v2 wpf stability batch 2 of 3 (runs 21-40)
        if: always() && github.ref == 'refs/heads/cursor/kiosk-locked-probe-v2'
        timeout-minutes: 55
        shell: pwsh
        env:
          WPF_STABILITY_RUNS: "20"
          WPF_STABILITY_FAIL_LATE: "1"
          WPF_STABILITY_PROBE_V2: "1"
          WPF_STABILITY_BATCH: "2"
          WPF_STABILITY_BATCH_OFFSET: "20"
        run: ./scripts/windows/ci-integration-wpf-stability.ps1
      - name: probe v2 pre-batch diagnostics (batch 3)
        if: always() && github.ref == 'refs/heads/cursor/kiosk-locked-probe-v2'
        shell: pwsh
        run: ./scripts/windows/ci-probe-v2-pre-batch.ps1 -Batch 3
      - name: probe v2 wpf stability batch 3 of 3 (runs 41-60)
        if: always() && github.ref == 'refs/heads/cursor/kiosk-locked-probe-v2'
        timeout-minutes: 55
        shell: pwsh
        env:
          WPF_STABILITY_RUNS: "20"
          WPF_STABILITY_FAIL_LATE: "1"
          WPF_STABILITY_PROBE_V2: "1"
          WPF_STABILITY_BATCH: "3"
          WPF_STABILITY_BATCH_OFFSET: "40"
        run: ./scripts/windows/ci-integration-wpf-stability.ps1
      - name: probe v2 upload stability failure artifacts
        if: always() && github.ref == 'refs/heads/cursor/kiosk-locked-probe-v2'
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-locked-probe-v2-failures
          if-no-files-found: ignore
          path: |
            artifacts/kiosk-windows-logs/wpf-stability-failure-evidence-*.log
            artifacts/kiosk-windows-logs/wpf-stability-run-*-err.log
            artifacts/kiosk-windows-logs/host-logout-failure-evidence-*.log
            artifacts/kiosk-windows-logs/host-logout-open-ack-*.log
      - name: probe wpf stability batch 1 of 3 (runs 1-20)
        if: github.ref == 'refs/heads/cursor/kiosk-locked-probe'
        timeout-minutes: 55
        shell: pwsh
        env:
          WPF_STABILITY_RUNS: "20"
          WPF_STABILITY_FAIL_LATE: "1"
          WPF_STABILITY_BATCH: "1"
          WPF_STABILITY_BATCH_OFFSET: "0"
        run: ./scripts/windows/ci-integration-wpf-stability.ps1
      - name: probe wpf stability batch 2 of 3 (runs 21-40)
        if: github.ref == 'refs/heads/cursor/kiosk-locked-probe'
        timeout-minutes: 55
        shell: pwsh
        env:
          WPF_STABILITY_RUNS: "20"
          WPF_STABILITY_FAIL_LATE: "1"
          WPF_STABILITY_BATCH: "2"
          WPF_STABILITY_BATCH_OFFSET: "20"
        run: ./scripts/windows/ci-integration-wpf-stability.ps1
      - name: probe wpf stability batch 3 of 3 (runs 41-60)
        if: github.ref == 'refs/heads/cursor/kiosk-locked-probe'
        timeout-minutes: 55
        shell: pwsh
        env:
          WPF_STABILITY_RUNS: "20"
          WPF_STABILITY_FAIL_LATE: "1"
          WPF_STABILITY_BATCH: "3"
          WPF_STABILITY_BATCH_OFFSET: "40"
        run: ./scripts/windows/ci-integration-wpf-stability.ps1
      - name: reset kiosk ci firewall and probe egress
        if: always() && github.ref != 'refs/heads/cursor/kiosk-locked-probe' && github.ref != 'refs/heads/cursor/kiosk-locked-probe-v2'
        timeout-minutes: 3
        shell: pwsh
        run: ./scripts/windows/ci-firewall-restore.ps1 -Restore -Evidence
      - name: print live-server-registry log
        if: always() && github.ref != 'refs/heads/cursor/kiosk-locked-probe'
        shell: pwsh
        run: |
          $registryLog = "artifacts/kiosk-windows-logs/live-server-registry.log"
          if (Test-Path $registryLog) {
            Write-Host "--- live-server-registry.log ---"
            Get-Content $registryLog
          } else {
            Write-Host "live-server-registry.log not found"
          }
      - name: print kiosk integration evidence
        if: always() && github.ref != 'refs/heads/cursor/kiosk-locked-probe'
        shell: pwsh
        run: ./scripts/windows/ci-integration-print.ps1
      - name: print probe stability summary
        if: always() && (github.ref == 'refs/heads/cursor/kiosk-locked-probe' || github.ref == 'refs/heads/cursor/kiosk-locked-probe-v2')
        shell: pwsh
        run: |
          $summary = "artifacts/kiosk-windows-logs/wpf-stability-summary.log"
          if (Test-Path $summary) { Get-Content $summary } else { Write-Host "no wpf-stability-summary.log" }
          Get-ChildItem artifacts/kiosk-windows-logs/wpf-stability-failure-evidence-*.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "--- $($_.Name) ---"
            Get-Content $_.FullName
          }
          Get-ChildItem artifacts/kiosk-windows-logs/wpf-stability-run-*.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "--- $($_.Name) (hb_ack lines) ---"
            Select-String -Path $_.FullName -Pattern 'HB_ACK|STAB_STEP|lockedReason' | ForEach-Object { $_.Line }
          }
      - name: probe v2 fail job on stability failures
        if: always() && github.ref == 'refs/heads/cursor/kiosk-locked-probe-v2'
        shell: pwsh
        run: |
          $summary = "artifacts/kiosk-windows-logs/wpf-stability-summary.log"
          if (-not (Test-Path $summary)) { throw "missing wpf-stability-summary.log" }
          $fails = Select-String -Path $summary -Pattern 'WPF_STABILITY_FAIL|WPF_STABILITY_BATCH_FAIL'
          $hostSummary = "artifacts/kiosk-windows-logs/host-logout-open-ack-summary.log"
          if (Test-Path $hostSummary) {
            $hostFails = Select-String -Path $hostSummary -Pattern 'HOST_LOGOUT_FAIL|HOST_LOGOUT_LOOP_FAIL'
            if ($hostFails) { $fails = @($fails) + @($hostFails) }
          }
          if ($fails) {
            Write-Host "probe v2 failures:"
            $fails | ForEach-Object { Write-Host $_.Line }
            exit 1
          }
          Write-Host "probe v2: 0 failures in summaries"
      - name: upload kiosk integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-windows-integration
          if-no-files-found: warn
          path: |
            artifacts/kiosk-windows-server.trx
            artifacts/kiosk-windows-guard.trx
            artifacts/watchdog.log
            artifacts/evidence/**
            artifacts/kiosk-windows-logs/**
            artifacts/kiosk-windows-logs/ci-heartbeat.log
            artifacts/kiosk-windows-logs/ci-firewall.log
            artifacts/kiosk-windows-logs/firewall-initial.json
            artifacts/kiosk-windows-logs/deadman.supervisor.log
            artifacts/kiosk-windows-logs/vstest-diag-*.log
            artifacts/kiosk-windows-logs/wpf-stability-*.log
            artifacts/kiosk-windows-logs/wpf-stability-summary.log
            artifacts/kiosk-windows-logs/wpf-stability-failure-evidence-*.log
            artifacts/kiosk-reconnect-mut/**
            artifacts/ci-timeout-marker.log
            artifacts/**/*.trx
            artifacts/**/Sequence*.xml
