name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    name: ubuntu net10
    # R10i OPEN-1: pinned. ubuntu-latest moved to ubuntu-26.04 (run 45874013364), whose newer pg client wrote
    # `SET transaction_timeout = 0;` into dumps that the postgres:16 service then rejected on restore.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gameclub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GAMECLUB_DATABASE: Host=localhost;Port=5432;Database=gameclub_test_${{ github.run_id }}_${{ github.run_attempt }}_linux;Username=postgres;Password=postgres
      GAMECLUB_TEST_DATABASE: Host=localhost;Port=5432;Database=gameclub_test_${{ github.run_id }}_${{ github.run_attempt }}_linux;Username=postgres;Password=postgres
      GAMECLUB_API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: pin postgresql client 16 (same major as the postgres:16 service)
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          for t in pg_dump pg_restore psql; do /usr/lib/postgresql/16/bin/$t --version; done
          client_major=$(/usr/lib/postgresql/16/bin/pg_dump --version | awk '{print $3}' | cut -d. -f1)
          server_num=$(PGPASSWORD=postgres /usr/lib/postgresql/16/bin/psql -h localhost -U postgres -d gameclub_test -tAc "SHOW server_version_num")
          echo "PG_CLIENT_PIN client_major=${client_major} server_version_num=${server_num}"
          test "${client_major}" = "16"
          test "$((server_num / 10000))" = "16"
      - name: powershell parse check
        shell: pwsh
        run: ./scripts/ci/ps-parse-check.ps1
      - name: ci integration entry smoke
        shell: pwsh
        run: ./scripts/ci/ps-entry-smoke.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install server test script dependencies
        working-directory: tests/GameClub.Server.Tests/Scripts
        run: npm ci
      - name: test net10
        run: |
          set +e
          set -o pipefail
          dotnet test GameClub.linux.slnf -c Release -f net10.0 --nologo -m:1 --filter "Category!=LiveCheckpointServer&Category!=PcInternetFirewall" 2>&1 | tee /tmp/linux-net10-test.log
          rc=${PIPESTATUS[0]}
          shell_line=$(grep -E 'GameClub\.Shell\.Tests\.dll' /tmp/linux-net10-test.log | grep -E 'Failed:|Passed!' | tail -1 || true)
          if [ -n "$shell_line" ]; then
            passed=$(echo "$shell_line" | sed -n 's/.*Passed: *\([0-9]*\).*/\1/p')
            failed=$(echo "$shell_line" | sed -n 's/.*Failed: *\([0-9]*\).*/\1/p')
            total=$(echo "$shell_line" | sed -n 's/.*Total: *\([0-9]*\).*/\1/p')
            echo "GAMECLUB_SHELL_TESTS_COUNT passed=${passed:-?} failed=${failed:-?} total=${total:-?}"
          else
            echo "GAMECLUB_SHELL_TESTS_COUNT missing"
            rc=1
          fi
          exit $rc
      - name: pc internet off verification unit tests
        run: |
          set -euo pipefail
          dotnet test tests/GameClub.Kiosk.Core.Tests/GameClub.Kiosk.Core.Tests.csproj -c Release -f net10.0 --nologo \
            --filter "Category=PcInternetFirewall" \
            --logger "console;verbosity=normal"
      - name: build GameClub.Server.TestHost for live kiosk tests
        run: dotnet build tests/GameClub.Server.TestHost/GameClub.Server.TestHost.csproj -c Release --nologo
      - name: kiosk owned-server G2 and re-pair oracle
        if: always()
        timeout-minutes: 30
        run: |
          set -euo pipefail
          dotnet build tests/GameClub.Kiosk.Windows.IntegrationTests/GameClub.Kiosk.Windows.IntegrationTests.csproj -c Release -f net10.0 --nologo
          G2_FILTER='FullyQualifiedName~live_server_two_outages_bill_matches_main_g2_oracle'
          G2_LISTED=$(dotnet test tests/GameClub.Kiosk.Windows.IntegrationTests/GameClub.Kiosk.Windows.IntegrationTests.csproj \
            -c Release -f net10.0 --no-build --nologo --list-tests --filter "$G2_FILTER" | grep -c 'live_server_two_outages_bill_matches_main_g2_oracle' || true)
          if [ "$G2_LISTED" -lt 1 ]; then
            echo "UBUNTU_G2_TEST_COUNT 0 listed — G2 oracle did not run"
            exit 1
          fi
          dotnet test tests/GameClub.Kiosk.Windows.IntegrationTests/GameClub.Kiosk.Windows.IntegrationTests.csproj \
            -c Release -f net10.0 --no-build --nologo \
            --filter "FullyQualifiedName~live_server_two_outages_bill_matches_main_g2_oracle|FullyQualifiedName~live_server_re_pair_new_device_key_heartbeats_resume" \
            --logger "console;verbosity=normal"
          echo "UBUNTU_G2_TEST_COUNT 1 passed"
      - name: pc special band live rate card oracle
        run: |
          set -euo pipefail
          dotnet build tests/GameClub.Kiosk.Windows.IntegrationTests/GameClub.Kiosk.Windows.IntegrationTests.csproj -c Release -f net10.0 --nologo
          dotnet test tests/GameClub.Kiosk.Windows.IntegrationTests/GameClub.Kiosk.Windows.IntegrationTests.csproj \
            -c Release -f net10.0 --no-build --nologo \
            --filter "FullyQualifiedName~PcSpecialBandLiveRateCardOracleTests" \
            --logger "console;verbosity=normal"
      - name: post-test orphan postgres writers
        if: always()
        env:
          PGPASSWORD: postgres
        run: |
          rows=$(psql -h localhost -U postgres -d gameclub_test -tA -c "SELECT count(*) FROM pg_stat_activity WHERE datname = 'gameclub_test' AND pid <> pg_backend_pid() AND state <> 'idle' AND query NOT ILIKE '%pg_stat_activity%';")
          echo "non_idle_pg_writers=$rows"
          test "$rows" = "0"

  windows:
    name: windows net48 and net10
    timeout-minutes: 10
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: powershell parse check
        shell: pwsh
        run: ./scripts/ci/ps-parse-check.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: build net48 kiosk and guard
        run: dotnet build src/GameClub.Kiosk/GameClub.Kiosk.csproj -c Release -f net48 --nologo && dotnet build src/GameClub.Kiosk.Guard/GameClub.Kiosk.Guard.csproj -c Release -f net48 --nologo
      - name: shell windowshell exclusion inventory
        shell: pwsh
        run: ./scripts/windows/shell-windowshell-inventory.ps1 -Role Excluded
      - name: test every target framework except server and windows kiosk integration
        run: dotnet test GameClub.slnx -c Release --nologo --filter "FullyQualifiedName!~GameClub.Server.Tests&FullyQualifiedName!~GameClub.Kiosk.Windows.IntegrationTests&FullyQualifiedName!~GameClub.Shell.Windows.IntegrationTests" --results-directory artifacts/windows-ci --logger "trx;LogFileName=windows-ci.trx"
      - name: kiosk trust paths and ACL (L-3)
        shell: pwsh
        run: |
          & ./installer/tests/KioskTrustPaths.Tests.ps1
          & ./installer/tests/KioskTrustFileAcl.Tests.ps1
      - name: upload windows ci test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-net48-net10-tests
          path: artifacts/windows-ci/**

  windows-kiosk-integration:
    name: windows-2022 kiosk integration
    # Job budget: run 44785725466 measured 43m47s with firewall phase cut at 780s; +5 min for full 1080s phase
    # ≈49 min; +10% headroom => 54 min.
    timeout-minutes: 54
    runs-on: windows-2022
    env:
      GAMECLUB_DATABASE: Host=localhost;Port=5432;Database=gameclub_test_ci;Username=postgres;Password=postgres;SSL Mode=Disable
      GAMECLUB_TEST_DATABASE: Host=localhost;Port=5432;Database=gameclub_test_ci;Username=postgres;Password=postgres;SSL Mode=Disable
      GAMECLUB_API_KEY: ci-test-key
      OperatorSessionSecret: ci-operator-secret-r11
      CHECKPOINT_SERVER_URL: http://127.0.0.1:5225
      ASPNETCORE_URLS: http://127.0.0.1:5225
      WPF_STABILITY_RUNS: "20"
    steps:
      - uses: actions/checkout@v4
      - name: powershell parse check
        shell: pwsh
        run: ./scripts/ci/ps-parse-check.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: disable in-step wpf stability loop
        shell: pwsh
        run: echo "WPF_STABILITY_RUNS=0" >> $env:GITHUB_ENV
      - name: install and start postgresql
        shell: pwsh
        run: |
          choco install postgresql16 --params '/Password:postgres' -y --no-progress
          $env:PGPASSWORD = 'postgres'
          $pgIsReady = 'C:\Program Files\PostgreSQL\16\bin\pg_isready.exe'
          $psql = 'C:\Program Files\PostgreSQL\16\bin\psql.exe'
          $deadline = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $deadline) {
            & $pgIsReady -U postgres 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 3
          }
          if ($LASTEXITCODE -ne 0) { throw 'postgresql service not ready' }
          $exists = & $psql -h 127.0.0.1 -U postgres -c "SELECT 1 FROM pg_database WHERE datname='gameclub_test_ci'" -tA 2>$null
          if (-not $exists) { & $psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE gameclub_test_ci;" }
      - name: windows kiosk integration
        # Run 44740272933: main kiosk phase ~12 min; 2× headroom so a hang fails visibly.
        timeout-minutes: 25
        shell: pwsh
        run: ./scripts/windows/ci-integration.ps1
      - name: pc internet firewall integration
        if: ${{ success() || failure() }}
        # REF runs 601s and 695s complete phases; cap 1080s + ~90s teardown needs 22 min step budget.
        timeout-minutes: 22
        shell: pwsh
        run: ./scripts/windows/ci-integration.ps1 -PcInternetFirewallOnly
      - name: reset kiosk ci firewall and probe egress
        if: always()
        timeout-minutes: 3
        shell: pwsh
        run: ./scripts/windows/ci-firewall-restore.ps1 -Restore -Evidence
      - name: kiosk host reconnect mutations (net48 D7 and status tick)
        if: always()
        timeout-minutes: 15
        shell: pwsh
        env:
          MUTOUT_DIR: artifacts/kiosk-reconnect-mut
          MUT_HOST_ONLY: "1"
        run: |
          New-Item -ItemType Directory -Force -Path $env:MUTOUT_DIR | Out-Null
          python scripts/agent/run-kiosk-reconnect-mutations.py | Tee-Object -FilePath "$env:MUTOUT_DIR/mutations.log"
          Get-Content "$env:MUTOUT_DIR/mutations-r1d.json"
      - name: orphan server and db writer check
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: ./scripts/windows/ci-orphan-check.ps1
      - name: wpf remaining time stability (20 runs)
        if: always()
        timeout-minutes: 25
        shell: pwsh
        env:
          WPF_STABILITY_RUNS: "20"
        run: ./scripts/windows/ci-integration-wpf-stability.ps1
      - name: upload wpf stability logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-wpf-stability-logs
          if-no-files-found: warn
          path: |
            artifacts/kiosk-windows-logs/wpf-stability-server-out.log
            artifacts/kiosk-windows-logs/wpf-stability-server-err.log
            artifacts/kiosk-windows-logs/wpf-stability-*.log
            artifacts/kiosk-windows-logs/live-checkpoint-*.log
      - name: print live-server-registry log
        if: always()
        shell: pwsh
        run: |
          $registryLog = "artifacts/kiosk-windows-logs/live-server-registry.log"
          if (Test-Path $registryLog) {
            Write-Host "--- live-server-registry.log ---"
            Get-Content $registryLog
          } else {
            Write-Host "live-server-registry.log not found"
          }
      - name: print kiosk integration evidence
        if: always()
        shell: pwsh
        run: ./scripts/windows/ci-integration-print.ps1
      - name: upload kiosk integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-windows-integration
          if-no-files-found: warn
          path: |
            artifacts/kiosk-windows-server.trx
            artifacts/kiosk-windows-guard.trx
            artifacts/kiosk-windows-pc-internet-firewall.trx
            artifacts/kiosk-windows-pc-internet-firewall-console.log
            artifacts/watchdog.log
            artifacts/evidence/**
            artifacts/kiosk-windows-logs/**
            artifacts/kiosk-windows-logs/ci-heartbeat.log
            artifacts/kiosk-windows-logs/ci-firewall.log
            artifacts/kiosk-windows-logs/firewall-initial.json
            artifacts/kiosk-windows-logs/deadman.supervisor.log
            artifacts/kiosk-windows-logs/vstest-diag-*.log
            artifacts/ci-timeout-marker.log
            artifacts/**/*.trx
            artifacts/**/Sequence*.xml

  windows-installer:
    name: windows-2022 installer
    timeout-minutes: 90
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: pin Inno Setup 6.7.1
        shell: pwsh
        run: choco install innosetup --version=6.7.1 -y --no-progress --allow-downgrade
      - name: PowerShell 5.1 parse installer scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path installer -Recurse -Include *.ps1,*.psm1 -File
          foreach ($f in $files) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              foreach ($e in $errors) { Write-Error "$($f.FullName): $($e.Message)" }
              exit 1
            }
          }
          $ciInstaller = Join-Path $PWD 'scripts/windows/ci-installer.ps1'
          $null = [System.Management.Automation.Language.Parser]::ParseFile($ciInstaller, [ref]$tokens, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            foreach ($e in $errors) { Write-Error "${ciInstaller}: $($e.Message)" }
            exit 1
          }
          Write-Host "PowerShell 5.1 parse: ok ($($files.Count) installer files + ci-installer.ps1)"
      - name: installer build
        shell: pwsh
        run: ./scripts/windows/ci-installer.ps1 -Phase Build
      - name: installer acceptance
        shell: pwsh
        timeout-minutes: 50
        run: ./scripts/windows/ci-installer.ps1 -Phase Acceptance
      - name: installer acceptance hang diagnostics
        if: always()
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/windows/Write-InstallerAcceptanceStepDiagnostics.ps1
      - name: upload installer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-installers
          path: |
            installer/server/Output/CheckpointServerSetup-*.exe
            installer/kiosk/Output/CheckpointKioskSetup-*.exe
            artifacts/installer/acceptance-logs/**
            artifacts/installer/ci-acceptance-manifest.json
            artifacts/installer/third-party-cache/**
      - name: upload installer hooks artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-installer-hooks
          path: installer/server/Output/CheckpointServerSetupHooks-*.exe

  windows-shell:
    name: windows-2022 shell
    timeout-minutes: 45
    runs-on: windows-2022
    env:
      GAMECLUB_DATABASE: Host=localhost;Port=5432;Database=gameclub_test_ci;Username=postgres;Password=postgres;SSL Mode=Disable
      GAMECLUB_TEST_DATABASE: Host=localhost;Port=5432;Database=gameclub_test_ci;Username=postgres;Password=postgres;SSL Mode=Disable
      GAMECLUB_API_KEY: ci-test-key
      OperatorSessionSecret: ci-operator-secret-r11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: install and start postgresql
        shell: pwsh
        run: |
          choco install postgresql16 --params '/Password:postgres' -y --no-progress
          $env:PGPASSWORD = 'postgres'
          $pgIsReady = 'C:\Program Files\PostgreSQL\16\bin\pg_isready.exe'
          $psql = 'C:\Program Files\PostgreSQL\16\bin\psql.exe'
          $deadline = (Get-Date).AddMinutes(5)
          while ((Get-Date) -lt $deadline) {
            & $pgIsReady -U postgres 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 3
          }
          if ($LASTEXITCODE -ne 0) { throw 'postgresql service not ready' }
          $exists = & $psql -h 127.0.0.1 -U postgres -c "SELECT 1 FROM pg_database WHERE datname='gameclub_test_ci'" -tA 2>$null
          if (-not $exists) { & $psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE gameclub_test_ci;" }
      - name: windows shell integration
        shell: pwsh
        run: ./scripts/windows/ci-shell.ps1
      - name: upload shell integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-windows-integration
          if-no-files-found: warn
          path: |
            artifacts/shell-windows.trx
            artifacts/window.json
            artifacts/shell-windows-logs/**
