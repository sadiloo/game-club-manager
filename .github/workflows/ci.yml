name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    name: ubuntu net10
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gameclub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GAMECLUB_DATABASE: Host=localhost;Port=5432;Database=gameclub_test;Username=postgres;Password=postgres
      GAMECLUB_TEST_DATABASE: Host=localhost;Port=5432;Database=gameclub_test;Username=postgres;Password=postgres
      GAMECLUB_API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: test net10
        run: dotnet test GameClub.slnx -c Release -f net10.0 --nologo

  windows:
    name: windows net48 and net10
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: build net48 kiosk and guard
        run: dotnet build src/GameClub.Kiosk/GameClub.Kiosk.csproj -c Release -f net48 --nologo && dotnet build src/GameClub.Kiosk.Guard/GameClub.Kiosk.Guard.csproj -c Release -f net48 --nologo
      - name: test every target framework except server and windows kiosk integration
        run: dotnet test GameClub.slnx -c Release --nologo --filter "FullyQualifiedName!~GameClub.Server.Tests&FullyQualifiedName!~GameClub.Kiosk.Windows.IntegrationTests"

  windows-kiosk-integration:
    name: windows-2022 kiosk integration
    runs-on: windows-2022
    env:
      GAMECLUB_DATABASE: Host=localhost;Port=5432;Database=gameclub_test;Username=postgres;Password=postgres
      GAMECLUB_TEST_DATABASE: Host=localhost;Port=5432;Database=gameclub_test;Username=postgres;Password=postgres
      GAMECLUB_API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: start postgres (docker)
        shell: pwsh
        run: |
          docker rm -f gameclub-ci-pg 2>$null
          docker run -d --name gameclub-ci-pg -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=gameclub_test -p 5432:5432 postgres:16
          $deadline = (Get-Date).AddMinutes(2)
          while ((Get-Date) -lt $deadline) {
            docker exec gameclub-ci-pg pg_isready -U postgres 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 2
          }
          if ($LASTEXITCODE -ne 0) { throw "postgres not ready" }
      - name: windows kiosk integration
        shell: pwsh
        run: ./scripts/windows/ci-integration.ps1
      - name: stop postgres
        if: always()
        shell: pwsh
        run: docker rm -f gameclub-ci-pg
      - name: upload kiosk integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-windows-integration
          path: |
            artifacts/kiosk-windows-server.trx
            artifacts/kiosk-windows-guard.trx
            artifacts/watchdog.log
            artifacts/evidence/**
            artifacts/kiosk-windows-logs/**
