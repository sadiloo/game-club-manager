<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <title>GameClub Operator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.5rem; }
    .tile { border: 1px solid #ccc; padding: 0.75rem; border-radius: 8px; cursor: pointer; }
    .tile[data-status="Free"] { background: #f4f4f4; }
    .tile[data-status="Playing"] { background: #e8f5e9; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <section id="login">
    <h1>Operator login</h1>
    <label>Username <input id="username" value="operator" /></label>
    <label>PIN <input id="pin" type="password" value="1111" /></label>
    <button id="loginBtn" type="button">Login</button>
  </section>
  <section id="app" class="hidden">
    <h1>Station grid</h1>
    <div id="grid"></div>
    <div id="bill" class="hidden">
      <h2>Bill</h2>
      <p id="billAmount"></p>
      <button id="surchargeBtn" type="button">+5,000</button>
      <button id="confirmBtn" type="button">Confirm cash</button>
      <button id="cancelBillBtn" type="button">Cancel bill</button>
    </div>
  </section>
  <script src="/operator/app.js"></script>
</body>
</html>
