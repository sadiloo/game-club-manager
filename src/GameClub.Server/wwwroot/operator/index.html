<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>چک‌پوینت — اپراتور</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/operator/lib/signalr.min.js"></script>
  <style>
    body { font-family: system-ui, Tahoma, sans-serif; margin: 1rem; max-width: 1040px; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.5rem; }
    .tile { border: 1px solid #ccc; padding: 0.75rem; border-radius: 8px; cursor: pointer; position: relative; }
    .tile[data-status="Free"] { background: #f4f4f4; }
    .tile[data-status="Playing"] { background: #e8f5e9; }
    .tile[data-status="Paused"] { background: #fff3e0; }
    .tile[data-status="Waiting for payment"] { background: #e3f2fd; }
    .tile[data-status="Manual settle"] { background: #fce4ec; }
    .tile[data-status="Buffet only"] { background: #f3e5f5; }
    .tile[data-status="Broken"] { background: #ffcdd2; }
    .tile[data-status="Reserved"] { background: #e1bee7; }
    .buffet-icon { position: absolute; left: 6px; top: 6px; font-size: 1.1rem; border: none; background: #fff; border-radius: 6px; cursor: pointer; padding: 0.15rem 0.35rem; }
    .hidden { display: none; }
    #error { color: #b00020; white-space: pre-wrap; }
    #billDetail { font-size: 0.9rem; white-space: pre-wrap; }
    .pay-line { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.25rem 0; }
    label { display: block; margin: 0.25rem 0; }
    section.panel { border: 1px solid #ddd; padding: 0.75rem; margin: 0.75rem 0; border-radius: 8px; }
    #buffetPanel .categories { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .cat { border: 1px solid #bbb; border-radius: 8px; padding: 0.5rem; min-width: 120px; }
    .cat:hover .cat-items, .cat.cat-open .cat-items { display: block; }
    .cat-items { display: none; margin-top: 0.5rem; }
    .cat-item { display: block; width: 100%; margin: 0.25rem 0; text-align: right; }
    .sale-line { display: flex; justify-content: space-between; gap: 0.5rem; margin: 0.2rem 0; font-size: 0.9rem; }
    #lowStockList { color: #c62828; font-size: 0.9rem; }
    #customerChip { background: #e8eaf6; padding: 0.35rem 0.5rem; border-radius: 6px; margin: 0.35rem 0; font-size: 0.9rem; }
    .customer-hit { display: block; width: 100%; text-align: right; margin: 0.2rem 0; }
    #customerSearchResults { max-height: 10rem; overflow: auto; border: 1px solid #ddd; padding: 0.35rem; margin: 0.25rem 0; border-radius: 6px; }
    .alert { background: #fff3e0; border: 1px solid #e65100; color: #bf360c; padding: 0.5rem 0.75rem; border-radius: 8px; font-weight: 600; }
    #prepaidGlobalAlert { margin: 0.5rem 0; }
  </style>
</head>
<body>
  <section id="login">
    <h1>ورود اپراتور</h1>
    <label>نام کاربری <input id="username" autocomplete="username" /></label>
    <label>رمز <input id="pin" type="password" autocomplete="current-password" /></label>
    <button id="loginBtn" type="button">ورود</button>
    <p id="loginError" class="hidden"></p>
  </section>
  <section id="app" class="hidden">
    <h1>سالن</h1>
    <p id="prepaidGlobalAlert" class="hidden" role="alert"></p>
    <p id="error" role="alert"></p>
    <p id="lowStockList"></p>
    <div id="grid"></div>

    <section id="buffetPanel" class="panel hidden">
      <h2>بوفه / خدمات</h2>
      <p id="buffetContext"></p>
      <div id="buffetCategories" class="categories"></div>
      <div id="buffetSaleLines"></div>
      <button id="buffetCheckoutBtn" type="button" class="hidden">تسویه بوفه</button>
      <button id="buffetCloseBtn" type="button">بستن</button>
    </section>

    <section id="customerPanel" class="panel">
      <h2>مشتری</h2>
      <div id="customerChip" class="hidden"></div>
      <div id="walletActions" class="hidden">
        <p id="walletBalance"></p>
        <button type="button" id="walletTopUpCash">شارژ نقدی کیف پول</button>
        <button type="button" id="walletTopUpCard">شارژ کارتخوان</button>
        <button type="button" id="walletTopUpC2c">شارژ کارت‌به‌کارت</button>
      </div>
      <label>جستجو (موبایل، نام، کارت)
        <input id="customerSearch" type="search" autocomplete="off" placeholder="0912… یا نام یا کد عضویت" />
      </label>
      <div id="customerSearchResults"></div>
      <details>
        <summary>ایجاد مشتری جدید</summary>
        <label>نام <input id="customerName" /></label>
        <label>موبایل <input id="customerMobile" type="tel" /></label>
        <label>کد عضویت (اختیاری) <input id="customerCode" /></label>
        <button id="customerCreateBtn" type="button">ایجاد و پیوند</button>
      </details>
      <button id="customerClearBtn" type="button">حذف پیوند</button>
    </section>

    <section id="sessionActions" class="panel hidden">
      <h2>جلسه</h2>
      <p id="sessionLabel"></p>
      <p id="prepaidStatus"></p>
      <button id="prepaidDurationBtn" type="button">رزرو زمان (دقیقه)</button>
      <button id="prepaidAmountBtn" type="button">رزرو مبلغ</button>
      <button id="pauseBtn" type="button">توقف</button>
      <button id="resumeBtn" type="button">ادامه</button>
      <label>بازیکن
        <select id="playerCountSelect">
          <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
        </select>
      </label>
      <button id="playerCountBtn" type="button">تغییر تعداد</button>
      <button id="openBillBtn" type="button">باز کردن صورتحساب</button>
      <button id="transferBtn" type="button" class="hidden">پرش ایستگاه</button>
      <label id="transferFaultWrap" class="hidden"><input type="checkbox" id="transferFaultChk" /> ایستگاه مبدأ خراب</label>
      <button id="opSellPackageBtn" type="button">فروش بسته</button>
    </section>

    <section id="manualSettlePanel" class="panel">
      <h2>صف تسویه دستی</h2>
      <ul id="manualSettleList"></ul>
    </section>

    <section id="pendingC2cPanel" class="panel">
      <h2>کارت‌به‌کارت در انتظار</h2>
      <ul id="pendingC2cList"></ul>
    </section>

    <section id="pendingWalletPanel" class="panel">
      <h2>شارژ کیف پول در انتظار</h2>
      <ul id="pendingWalletList"></ul>
    </section>

    <section id="managerPanel" class="panel hidden">
      <h2>مدیر</h2>
      <button id="mgrGiftBtn" type="button">اعتبار هدیه</button>
      <button id="mgrOpeningBtn" type="button">مانده افتتاحیه</button>
      <button id="mgrFloorBtn" type="button">سقف نسیه</button>
      <button id="mgrLadderBtn" type="button">جدول سطح‌ها (JSON)</button>
      <button id="mgrBirthdayBtn" type="button">تنظیم تولد</button>
      <button id="mgrCustBirthdayBtn" type="button">تاریخ تولد عضو</button>
      <button id="mgrPackageBtn" type="button">تعریف بسته</button>
      <button id="mgrSellPackageBtn" type="button">فروش بسته</button>
    </section>

    <section id="bill" class="panel hidden">
      <h2>صورتحساب</h2>
      <div id="billDetail"></div>
      <div id="billSaleLines"></div>
      <p id="cashChange"></p>
      <div id="paymentLines"></div>
      <button id="addCashLineBtn" type="button">نقد</button>
      <button id="addCardLineBtn" type="button">کارتخوان</button>
      <button id="addC2cLineBtn" type="button">کارت‌به‌کارت</button>
      <button id="addWalletLineBtn" type="button">کیف پول</button>
      <button id="openBuffetFromBillBtn" type="button">بوفه</button>
      <button id="surchargeBtn" type="button">+۵٬۰۰۰</button>
      <button id="confirmBtn" type="button">تأیید پرداخت</button>
      <button id="cancelBillBtn" type="button">لغو صورتحساب</button>
    </section>

    <section id="shiftPanel" class="panel">
      <h2>شیفت / اتمام روزکاری</h2>
      <p id="shiftState"></p>
      <div id="cafeSettings" class="hidden">
        <label><input type="checkbox" id="shiftsEnabledToggle" /> شیفت فعال</label>
        <label><input type="checkbox" id="multiOperatorToggle" /> چند اپراتور / کشوی مشترک</label>
        <button id="saveCafeSettingsBtn" type="button">ذخیره تنظیمات</button>
      </div>
      <button id="openShiftBtn" type="button">باز کردن شیفت</button>
      <button id="closePreviewBtn" type="button">پیش‌نمایش بستن</button>
      <div id="closeSessionList"></div>
      <label>روزکاری (شمسی) سال <input id="closeJy" type="number" /></label>
      <label>ماه <input id="closeJm" type="number" /></label>
      <label>روز <input id="closeJd" type="number" /></label>
      <label>نقد شمارش‌شده <input id="closeCash" type="number" /></label>
      <label>جمع کارتخوان <input id="closeReader" type="number" /></label>
      <label>توضیح مغایرت <input id="closeExpl" /></label>
      <button id="closeShiftBtn" type="button">بستن شیفت / روزکاری</button>
      <div id="closePreviewSummary"></div>
    </section>

    <section id="reportsPanel" class="panel hidden">
      <h2>گزارش‌های مدیریتی</h2>
      <label>روزکاری (شمسی) سال <input id="repJy" type="number" value="1405" /></label>
      <label>ماه <input id="repJm" type="number" value="8" /></label>
      <label>روز <input id="repJd" type="number" value="16" /></label>
      <button id="dailyIncomeBtn" type="button">درآمد روزانه</button>
      <button id="monthlyIncomeBtn" type="button">درآمد ماهانه (شمسی)</button>
      <button id="yearlyIncomeBtn" type="button">درآمد سالانه (شمسی)</button>
      <p>بازه مصرف (شمسی)</p>
      <label>از — سال <input id="usageFromJy" type="number" value="1405" /> ماه <input id="usageFromJm" type="number" value="8" /> روز <input id="usageFromJd" type="number" value="16" /></label>
      <label>تا — سال <input id="usageToJy" type="number" value="1405" /> ماه <input id="usageToJm" type="number" value="8" /> روز <input id="usageToJd" type="number" value="17" /></label>
      <button id="usageBtn" type="button">مصرف ایستگاه</button>
      <button id="cu8Btn" type="button">CU-8 کیف پول</button>
      <p>فیلتر تاریخچه</p>
      <label>از — سال <input id="histFromJy" type="number" /> ماه <input id="histFromJm" type="number" /> روز <input id="histFromJd" type="number" /></label>
      <label>تا — سال <input id="histToJy" type="number" /> ماه <input id="histToJm" type="number" /> روز <input id="histToJd" type="number" /></label>
      <label>ایستگاه <input id="histStation" type="text" placeholder="PS5-1" /></label>
      <label>مشتری (UUID) <input id="histCustomer" type="text" /></label>
      <label>اپراتور (UUID) <input id="histOperator" type="text" /></label>
      <label>روش <input id="histMethod" type="text" placeholder="Cash" /></label>
      <button id="historyBtn" type="button">تاریخچه</button>
      <button id="exportHistoryBtn" type="button">خروجی CSV تاریخچه</button>
      <div id="reportsOut"></div>
    </section>

    <section id="invoicePanel" class="panel">
      <h2>جستجوی فاکتور</h2>
      <label>شماره <input id="invoiceNumber" type="number" /></label>
      <button id="loadInvoiceBtn" type="button">بارگذاری</button>
      <button id="voidInvoiceBtn" type="button">باطل (مدیر)</button>
      <pre id="invoiceDetail"></pre>
    </section>
  </section>
  <script src="/operator/app.js"></script>
</body>
</html>
